  background: #fff3cd;
  opacity: 1;
}

.ua-list li.ua-prep {
  background: #dbeafe;
}

.ua-list li.ua-lunch {
  background: #dcfce7;
}

  /* Other activities retain their existing appearance */
}

function renderSchedule(rows,displayName,mins,weekend,compact=false){
 const currentItems=rows.filter(x=>mins>=x.a&&(x.b==null||mins<x.b));
 const current=currentItems[0]||null,next=rows.find(x=>x.a>mins);
 let html='';
 if(weekend)html=`<div class="now" style="background:var(--card);color:var(--fg)"><div class="what">No weekday schedule</div><div class="when">It’s the weekend.</div></div>`;
 else if(current){
  html+=`<div class="now" style="background:var(${COLORS[current.color]||'--oth'});"><small>${displayName} is in</small><div class="what">${currentItems.map(x=>x.name).join(' + ')}</div><div class="when">${currentItems.map(x=>formatTime(x.a)+'–'+(x.b?formatTime(x.b):'Dismissal')).join(' · ')}</div>${currentItems.map(x=>x.note?`<div class="note">${x.note}</div>`:'').join('')}</div>`;
 }else{
  const end=rows.reduce((m,x)=>Math.max(m,x.b||0),0);
  const msg=mins<Math.min(...rows.map(x=>x.a))?'Not started yet':mins>=end?'School day is over':'Between scheduled blocks';
  html+=`<div class="now" style="background:var(--card);color:var(--fg)"><div class="what">${msg}</div></div>`;
 }
 if(!weekend&&next)html+=`<p class="next">Next: <b>${next.name}</b> at ${formatTime(next.a)}</p>`;
 html+='<ol>'+rows.map(x=>{const active=!weekend&&currentItems.includes(x),past=!weekend&&x.b!=null&&x.b<=mins;return `<li class="${active?'cur':past?'past':''}"><i style="background:var(${COLORS[x.color]||'--oth'})"></i><span class="t">${formatTime(x.a)}–${x.b?formatTime(x.b):'Dismissal'}</span><span>${x.name}</span></li>`}).join('')+'</ol>';
 return html;
}
function renderAll(mins,weekend){
 const cards=[];
 for(const [g,item] of Object.entries(S[building])){
  const groups=Array.isArray(item)?[{title:'',teacher:'',rows:item}]:item.groups;
  let body='';
  for(const group of groups){
   const active=group.rows.filter(x=>mins>=x.a&&(x.b==null||mins<x.b));
   const first=group.rows[0],end=group.rows.reduce((m,x)=>Math.max(m,x.b||0),0);
   let label='',meta='';
   if(weekend){label='No weekday schedule';meta='Weekend'}
   else if(active.length){label=active.map(x=>x.name).join(' + ');meta=active.map(x=>formatTime(x.a)+'–'+(x.b?formatTime(x.b):'Dismissal')).join(' · ')}
   else if(mins<first.a){label='Not started yet';meta='Starts '+formatTime(first.a)}
   else if(mins>=end)label='School day is over';else label='Between scheduled blocks';
   const title=group.teacher?'<b>'+group.title+' · '+group.teacher+'</b>':'';
   const color=active.length?(COLORS[active[0].color]||'--oth'):'--line';
   body+='<div class="all-group">'+title+'<div class="all-current"><i style="background:var('+color+')"></i>'+label+'</div>'+(meta?'<div class="all-meta">'+meta+'</div>':'')+active.map(x=>x.note?'<div class="all-meta">'+x.note+'</div>':'').join('')+'</div>';
  }
  cards.push('<section class="all-card"><h2>'+g+'</h2>'+body+'</section>');
 }
 return '<div class="all-grid">'+cards.join('')+'</div>';
}

function renderUAClass(area,mins,dayType){
 const source=UA_FULL_DAY[dayType][area]||[];
 if(!source.length)return '<section class="all-card"><h2>'+area+'</h2><div class="all-current">No schedule listed.</div></section>';
 const blocks=[];
 let cursor=8*60+35;
 const fmt=n=>{let h=Math.floor(n/60),m=n%60;return (h>12?h-12:h)+':'+String(m).padStart(2,'0');};
 for(const x of source){
  const a=uaMinutes(x.start),b=uaMinutes(x.end);
  if(a>cursor)blocks.push({start:fmt(cursor),end:fmt(a),label:'Unassigned / transition',kind:'free'});
  blocks.push({...x,kind:/^\s*(prep|mini prep)\s*$/i.test(x.label)?'prep':/lunch/i.test(x.label)?'lunch':/bus duty|walker|office/i.test(x.label)?'duty':/department meeting|relationship block|supporting|shelving|lenny/i.test(x.label)?'other':'class'});
  cursor=Math.max(cursor,b);
 }
 const active=blocks.filter(x=>mins>=uaMinutes(x.start)&&mins<uaMinutes(x.end));
 const next=blocks.find(x=>uaMinutes(x.start)>mins);
 const summary=active.length?active.map(x=>x.label).join(' · '):next?'Next: '+next.label+' at '+next.start:'School day is over';
 const list=blocks.map(x=>'<li class="'+(active.includes(x)?'cur ':'')+'ua-'+x.kind+'"><span class="ua-time">'+x.start+'–'+x.end+'</span><span class="ua-area">'+x.label+'</span></li>').join('');
 return '<section class="all-card"><h2>'+area+' · Full-day schedule</h2><div class="all-current">'+summary+'</div><ul class="ua-list">'+list+'</ul><div class="foot">Unassigned / transition indicates time without a named activity in the source schedule; it does not necessarily mean free time.</div></section>';
}
function renderUA(mins,now){
 const key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
 const dayType=UA_CALENDAR[key];
 if(now.getDay()===0||now.getDay()===6)return '<div class="now" style="background:var(--card);color:var(--fg)"><div class="what">No school-day UA schedule</div><div class="when">Weekend</div></div>';
 if(UA_MINIMUM.has(key))return '<div class="now" style="background:var(--card);color:var(--fg)"><div class="what">Minimum school day</div><div class="when">The typical Unified Arts schedule does not apply. No UA assignment is displayed.</div></div>';
 if(!dayType)return '<div class="now" style="background:var(--card);color:var(--fg)"><div class="what">No Unified Arts schedule listed</div><div class="when">This date is not marked as a regular A/B/C/D instructional day in the 2026–2027 calendar.</div></div>';
 const heading='<div class="now" style="background:var(--ua)"><small>Webb Unified Arts · '+key+'</small><div class="what">'+dayType+' Day</div><div class="when">Music, P.E., Art and Media</div></div>';
 if(UA_CLASSES.includes(grade))return heading+renderUAClass(grade,mins,dayType);
 const grades=grade==='All'?UA_GRADES:[grade];
 return heading+'<div class="all-grid">'+grades.map(g=>renderUAGrade(g,mins,dayType)).join('')+'</div>';
}
function render(){
 const now=new Date(),mins=override?(()=>{const [h,m]=override.split(':').map(Number);return h*60+m})():now.getHours()*60+now.getMinutes(),day=now.getDay(),weekend=!override&&(day===0||day===6);
 $('clock').textContent=(override?'Checking ':'')+formatTime(mins)+(mins>=720?' PM':' AM')+(override?'':' · '+now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}));
 makeButtons($('views'),['Classroom','Unified Arts'],view==='classroom'?'Classroom':'Unified Arts',v=>setView(v==='Classroom'?'classroom':'ua'));
 $('buildings').previousElementSibling.classList.toggle('hidden',view==='ua');
 $('buildings').classList.toggle('hidden',view==='ua');
 if(view==='ua'){
  if(!['All',...UA_GRADES,...UA_CLASSES].includes(grade))grade='Kindergarten';
  makeButtons($('chips'),['All',...UA_GRADES,...UA_CLASSES],grade,setGrade);
  $('out').innerHTML=renderUA(mins,now);
  $('sourceNote').textContent='Source: Webb Typical UA Schedule (including prep, lunch, duties and other listed assignments) and Webb ABCD Calendar 2026–2027. Minimum school days are intentionally excluded; dates without an A/B/C/D instructional-day entry are not shown as regular UA days.';
 }else{
  if(grade!=='All'&&!getGrades().includes(grade))grade='Kindergarten';
  makeButtons($('buildings'),['Webb','EW'],building,setBuilding);
  makeButtons($('chips'),['All',...getGrades()],grade,setGrade);
  if(grade==='All')$('out').innerHTML=renderAll(mins,weekend);
  else{
   const item=S[building][grade];
   if(Array.isArray(item))$('out').innerHTML=renderSchedule(item,grade,mins,weekend);
   else $('out').innerHTML='<div class="groups">'+item.groups.map(group=>`<section class="group-card"><h2>${grade} · ${group.title}</h2><div class="teacher">${group.teacher}</div>${renderSchedule(group.rows,group.teacher,mins,weekend,true)}</section>`).join('')+'</div>';
  }
  $('sourceNote').textContent=building==='Webb'
  ?'Source: Webb Building Schedule 2026–2027, Instructional Blocks. Weekday schedule only; holidays, closures, and special-day changes are not included. Webb schedule retained from the original app.'
  :'Source: EW Grade Level Schedules 2026–2027 and the additional Grade 4 column supplied in chat. Weekday schedule only; holidays, closures, and special-day changes are not included. Grade 5/6 cards show the three teacher groups and their rotation assignments from the source; unspecified periods are not inferred. The Grade 2 source lists ELA TSG continued (12:40–1:55) and Math (12:55–1:55) as overlapping; both are shown as written.';
 }
}
