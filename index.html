const COLORS={a:'--arr',c:'--cir',w:'--win',e:'--ela',m:'--mat',f:'--ufl',u:'--ua',t:'--trv',r:'--rec',l:'--lun',s:'--sci',o:'--oth',d:'--rea',x:'--ext',ext:'--ext'};
const DATA={Webb:WEBB,EW:Object.fromEntries(Object.entries(EW).map(([g,v])=>[g,v.rows||v.groups]))};
const toMinutes=v=>{if(!v)return null;let [h,m]=v.split(':').map(Number);if(h<8)h+=12;return h*60+m};
const formatTime=n=>{if(n==null)return '';let h=Math.floor(n/60),m=n%60;h=h%12||12;return h+':'+String(m).padStart(2,'0')};
const normalize=rows=>rows.map(([a,b,name,color,note])=>({a:toMinutes(a),b:toMinutes(b),name,color,note:note||''})).sort((x,y)=>x.a-y.a);
const S={Webb:{},EW:{}};
for(const [g,rows] of Object.entries(WEBB))S.Webb[g]=normalize(rows);
for(const [g,entry] of Object.entries(EW))S.EW[g]=entry.rows?normalize(entry.rows):{groups:entry.groups.map(gr=>({...gr,rows:normalize(gr.rows)}))};

function getGrades(){return Object.keys(S[building])}
try{grade=localStorage.getItem('wieGrade_'+building)}catch(e){}
if(!getGrades().includes(grade))grade=building==='Webb'?'Kindergarten':'Kindergarten';

function makeButtons(container,items,selected,onSelect){
 container.innerHTML=items.map(item=>`<button type="button" data-value="${item}" aria-pressed="${String(item===selected)}">${item}</button>`).join('');

}
function setBuilding(value){

 try{localStorage.setItem('wieBuilding',building);localStorage.setItem('wieGrade_'+building,grade)}catch(e){}

}
function setGrade(value){
 grade=value;
 try{localStorage.setItem('wieGrade_'+building,grade)}catch(e){}
 render();
}
function renderSchedule(rows,displayName,mins,weekend,compact=false){
 const currentItems=rows.filter(x=>mins>=x.a&&(x.b==null||mins<x.b));
 const current=currentItems[0]||null,next=rows.find(x=>x.a>mins);
 let html='';
 if(weekend)html=`<div class="now" style="background:var(--card);color:var(--fg)"><div class="what">No weekday schedule</div><div class="when">It’s the weekend.</div></div>`;
 else if(current){
  html+=`<div class="now" style="background:var(${COLORS[current.color]||'--oth'});"><small>${displayName} is in</small><div class="what">${currentItems.map(x=>x.name).join(' + ')}</div><div class="when">${currentItems.map(x=>formatTime(x.a)+'–'+(x.b?formatTime(x.b):'Dismissal')).join(' · ')}</div>${currentItems.map(x=>x.note?`<div class="note">${x.note}</div>`:'').join('')}</div>`;
 }else{
  const end=rows.reduce((m,x)=>Math.max(m,x.b||0),0);
  const msg=mins<Math.min(...rows.map(x=>x.a))?'Not started yet':mins>=end?'School day is over':'Between scheduled blocks';
  html+=`<div class="now" style="background:var(--card);color:var(--fg)"><div class="what">${msg}</div></div>`;
 }
 if(!weekend&&next)html+=`<p class="next">Next: <b>${next.name}</b> at ${formatTime(next.a)}</p>`;
 html+='<ol>'+rows.map(x=>{const active=!weekend&&currentItems.includes(x),past=!weekend&&x.b!=null&&x.b<=mins;return `<li class="${active?'cur':past?'past':''}"><i style="background:var(${COLORS[x.color]||'--oth'})"></i><span class="t">${formatTime(x.a)}–${x.b?formatTime(x.b):'Dismissal'}</span><span>${x.name}</span></li>`}).join('')+'</ol>';
 return html;
}
function render(){
 const now=new Date(),mins=override?(()=>{const [h,m]=override.split(':').map(Number);return h*60+m})():now.getHours()*60+now.getMinutes(),day=now.getDay(),weekend=!override&&(day===0||day===6);
 $('clock').textContent=(override?'Checking ':'')+formatTime(mins)+(mins>=720?' PM':' AM')+(override?'':' · '+now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}));
 makeButtons($('buildings'),['Webb','EW'],building,setBuilding);
 makeButtons($('chips'),getGrades(),grade,setGrade);
 const item=S[building][grade];
 if(Array.isArray(item)){
  $('out').innerHTML=renderSchedule(item,grade,mins,weekend);
 }else{
  $('out').innerHTML='<div class="groups">'+item.groups.map(group=>`<section class="group-card"><h2>${grade} · ${group.title}</h2><div class="teacher">${group.teacher}</div>${renderSchedule(group.rows,group.teacher,mins,weekend,true)}</section>`).join('')+'</div>';
 }
 $('sourceNote').textContent=building==='Webb'
 ?'Source: Webb Building Schedule 2026–2027, Instructional Blocks. Weekday schedule only; holidays, closures, and special-day changes are not included. Webb schedule retained from the original app.'
 :'Source: EW Grade Level Schedules 2026–2027 and the additional Grade 4 column supplied in chat. Weekday schedule only; holidays, closures, and special-day changes are not included. Grade 5/6 cards show the three teacher groups and their rotation assignments from the source; unspecified periods are not inferred. The Grade 2 source lists ELA TSG continued (12:40–1:55) and Math (12:55–1:55) as overlapping; both are shown as written.';
}
$('ot').addEventListener('change',e=>{override=e.target.value||null;render()});
$('rs').addEventListener('click',()=>{override=null;$('ot').value='';render()});
render();setInterval(()=>{if(!override)render()},15000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offlineStatus').textContent='Offline copy is ready. You can test it in Airplane Mode.'}).catch(()=>{$('offlineStatus').textContent='Offline caching could not be enabled in this browser.'}))}
</script>
